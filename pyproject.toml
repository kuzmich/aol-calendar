[project]
name = "aol-calendar"
version = "0.1.0"
description = "Календарь курсов и мероприятий ИЖ в Иркутске"
readme = "README.md"
authors = [
    { name = "Alexey Kuzminich", email = "akuzminich@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "jinja2>=3.1.6",
    "psycopg>=3.2",
    # под FreeBSD (serv00) бинарных колес нет, там psycopg работает с системной libpq
    "psycopg-binary>=3.2; platform_system != 'FreeBSD'",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "fabric>=3.2.2",
    "ipython>=9.6.0",
]
# работа с админкой artofliving.ru (events/sync.py); пакета нет на PyPI, поэтому он не в зависимостях
# wheel, на сервер его отдельно ставит fab deploy
sync = [
    "aa",
]

[tool.uv]
default-groups = ["dev", "sync"]

[tool.uv.sources]
aa = { path = "../automation", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["config", "events"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
