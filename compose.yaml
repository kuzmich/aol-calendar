name: aol-calendar

services:
  postgres:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # 5432 на хосте занят другими проектами
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=aol_calendar
      - POSTGRES_USER=aol_calendar
      - POSTGRES_PASSWORD=aol_calendar

volumes:
  postgres_data:
